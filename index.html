const lessonDetails={
'Why Watches Still Matter':[
['A watch is no longer necessary for knowing the time, which is exactly why it is worth studying. It sits at the intersection of engineering, design, history, utility and personal taste. Learning watches teaches you how to look past a logo and ask what an object is for, how it was made and why people value it.','For most of history, accurate time was difficult to carry. A watch therefore began as serious technology, not decoration. As clocks became smaller and manufacturing improved, the watch moved from a specialist instrument toward an everyday object, then into a luxury and cultural object after electronic timekeeping made mechanical precision less necessary.','Find three watches in ordinary life. For each, identify its likely purpose, approximate era of design, and one visual clue that supports your conclusion.'],
['Which statement best explains why watches remain worth learning?',['They are expensive accessories','They combine technology, history, design and human judgment in a small object','They are still the most accurate way to know the time','Every gentleman is expected to own one'],1,'A watch is a compact case study in how technology becomes culture.'],
'Learn the reason before the specification. If you know what problem a feature or design was meant to solve, the vocabulary becomes memorable instead of becoming a list.'],
'The Long History of Timekeeping':[
['Timekeeping began with observation. People used the movement of the sun, shadows, stars and recurring natural events to divide the day and year. Sundials gave a visible relationship between sunlight and time; water clocks allowed time to be measured without direct sunlight. These systems were imperfect, but they established the central idea: time could be represented by a repeatable physical process.','Mechanical clocks changed the problem. Instead of merely observing nature, a clock could create a controlled repeating process and count it. Medieval European clockmaking produced large public clocks, while later developments in springs, escapements and manufacturing made timekeeping progressively smaller and more portable. The important story is not a straight march toward wristwatches; it is centuries of solving accuracy, reliability, power and portability.','A useful historical chain is: natural cycles → instruments that display those cycles → mechanical clocks → portable clocks → watches. Each step reduced dependence on the environment and increased personal control over time.'],
['What is the most important historical development behind the watch?',['The invention of smartphones','The ability to create increasingly portable and controlled timekeeping','The invention of decorative dials','The disappearance of public clocks'],1,'The watch is the result of centuries of miniaturizing and controlling timekeeping mechanisms.'],
'When you study a watch, ask which older problem it inherits: portability, legibility, accuracy, power or reliability. History becomes useful when it explains design.'],
'From Pocket Watch to Wristwatch':[
['Pocket watches dominated personal timekeeping for centuries. They were carried in a pocket and often attached to a chain. That arrangement worked well for formal life but was awkward when both hands were occupied. Wrist-worn watches existed before the twentieth century, but their practical importance grew as soldiers, aviators and other professionals needed to read time quickly.','War and professional use accelerated the change. A wristwatch could be read with a glance, while luminous numerals or hands improved visibility in poor conditions. Aviation encouraged larger, highly legible dials; diving encouraged water resistance and elapsed-time bezels; military field use emphasized robustness and simplicity.','By the mid-twentieth century, the wristwatch had become the normal personal watch. Its design language still carries traces of those working environments even when a modern owner simply wears one to dinner.'],
['Why did the wristwatch overtake the pocket watch?',['It was always more decorative','It could be read quickly while the wearer was active','Pocket watches could not keep time','Wristwatches were invented after quartz'],1,'Accessibility during work made the wristwatch a practical tool.'],
'Good design often survives after the original problem changes. Recognizing that lineage lets you see a modern watch as a descendant of a tool, not merely an accessory.'],
'Anatomy of a Watch':[
['Start outside and work inward. The case protects the movement; the crystal covers the dial; the crown allows setting and, depending on the movement, winding; the dial presents information; the hands indicate it; and the bezel may protect the crystal or provide a functional scale. The caseback closes the system and may be solid or transparent.','Inside, a mechanical watch contains an energy source, transmission system, escapement and regulating system. A quartz watch uses a battery or other electrical source, a quartz oscillator and electronic circuitry to control the display. These are different machines even when the exterior looks nearly identical.','When examining a watch, use a fixed sequence: case → crystal → bezel → crown → dial → hands → caseback → movement. This prevents you from judging it only by appearance.'],
['Which part is primarily responsible for protecting the dial and movement from the outside?',['The crystal and case','The seconds hand','The hour marker','The strap buckle'],0,'The case and crystal form the main protective enclosure.'],
'Know the nouns before you judge the object. Precise observation is the beginning of horological literacy.'],
'Mechanical, Automatic & Manual-Wind':[
['Mechanical describes the underlying timekeeping method: stored mechanical energy is released through gears and an escapement and regulated by an oscillator. Automatic and manual-wind describe how that mechanical movement receives energy. An automatic movement uses a rotor and winding system; a manual movement is wound by turning the crown.','This distinction matters because the terms are often used loosely. An automatic watch is mechanical, but not every mechanical watch is automatic. A manual-wind watch can have the same basic architecture of mainspring, gear train, escapement and balance as an automatic watch; the major difference is the winding system.','When comparing movements, ask two separate questions: What is the timekeeping technology? How is it powered or wound? That vocabulary prevents a surprising amount of confusion.'],
['Which statement is most accurate?',['Automatic and mechanical mean exactly the same thing','Automatic describes a winding system within a mechanical movement','Manual-wind movements use quartz regulation','Mechanical watches cannot be wound by a crown'],1,'Automatic is a method of winding a mechanical movement; mechanical describes the timekeeping system.'],
'Use categories precisely. A gentleman should be able to explain a technical distinction without turning it into a status symbol.'],
'Quartz, Solar & Modern Movements':[
['Quartz timekeeping transformed the watch industry because it solved the basic problem of accurate portable time at remarkably low cost. A quartz crystal oscillates at a stable frequency when energized; electronics divide that frequency into a signal used to drive the display. Solar watches add an energy-harvesting system that converts light into electrical energy and stores it for later use.','The quartz revolution also changed the meaning of a mechanical watch. Once highly accurate electronic timekeeping became inexpensive, mechanical watches could no longer justify themselves primarily as practical necessities. Their value shifted toward craftsmanship, engineering interest, heritage, finishing, interaction and design.','Modern watchmaking is therefore not a contest with one winner. Quartz can dominate accuracy and convenience while mechanical watches can offer a different kind of engineering and human appeal. Good judgment keeps those criteria separate.'],
['What did quartz change most profoundly?',['It made accurate portable timekeeping widely accessible','It made all mechanical movements electronic','It eliminated the need for watch design','It made solar power obsolete'],0,'Quartz made highly accurate, low-maintenance timekeeping accessible at enormous scale.'],
'Never use “better” without naming the criterion. Accuracy, convenience, craftsmanship, heritage and emotional appeal are different judgments.'],
'Time, Date & Calendar':[
['The simplest watch displays hours, minutes and seconds. Adding a date changes the information architecture: the wearer now has both time and calendar information. A day-date display adds the weekday. These functions look simple but require a mechanism to advance the display, account for different month lengths, and allow safe setting procedures.','A useful distinction is function versus complication. In watch culture, a complication is generally an additional mechanism beyond simple timekeeping. A date can therefore be treated as a complication even though it is extremely common. The practical value comes from solving a real problem without making the display difficult to read.','When evaluating a date display, consider legibility, placement, transition behavior and whether the function is actually useful to the wearer.'],
['Which question is most useful when judging a date complication?',['Is it famous?','Does it solve a real need without harming legibility or usability?','Is it the most expensive option?','Does it have the most subdials?'],1,'Useful complications earn their complexity by solving a problem well.'],
'Complexity is not sophistication by itself. The better question is whether the added information earns its place.'],
'Chronographs & Timing':[
['A chronograph is a watch with a timing function that measures elapsed time. A typical chronograph has a start/stop control, a reset control and one or more registers showing elapsed seconds, minutes or hours. The ordinary time display and the stopwatch system can operate together.','Chronographs became useful because elapsed time mattered in real work: scientific experiments, navigation, aviation, motorsport and industrial processes all created timing problems. Racing pushed designers toward highly legible scales and fast operation. This is why chronograph dials can look busy: each subdial or scale may exist for a specific measurement.','To read one, first identify the ordinary time display. Then identify the chronograph seconds hand and the registers. Do not assume every subdial has the same job.'],
['What makes a chronograph different from a simple three-hand watch?',['It measures elapsed time','It must have a rotating bezel','It is always mechanical','It always displays two time zones'],0,'The defining function is elapsed-time measurement.'],
'Understand the measurement before admiring the machinery. A complicated dial is only elegant when you can explain what the information is doing.'],
'GMT, World Time & Travel':[
['Travel creates a simple human problem: your body may be in one time zone while your schedule, home or colleagues are in another. A GMT-style watch typically adds an independently readable 24-hour indication for a second time zone. A world-time watch presents many zones around a city ring or similar display.','These are not interchangeable. A traveler who needs one home time and one local time may prefer a clear GMT display. Someone who regularly coordinates across many regions may value a world-time interface. The point is not to maximize complication count; it is to match the display to the problem.','When evaluating a travel watch, ask which time zone is primary, which is secondary, whether daylight-saving changes matter, and whether the display can be read instantly.'],
['What problem does a GMT function primarily address?',['Water resistance','Reading another time zone','Measuring dive depth','Measuring elapsed seconds'],1,'GMT functions provide an additional time-zone indication.'],
'Function should determine complexity. If one second time zone solves the problem, ten time zones may be unnecessary.'],
'Advanced Complications':[
['A complication adds information or functionality through additional mechanism. Power-reserve indicators show how much stored energy remains. Moonphase displays track the lunar cycle. Perpetual calendars account for month lengths and leap years through a programmed mechanical cycle. Alarms, minute repeaters and tourbillons represent more specialized engineering and historical traditions.','The important lesson is not to memorize a list. Complications represent different engineering problems: calculating, displaying, storing energy, striking sound or controlling a mechanism. Their difficulty, usefulness and finishing requirements vary. Some are practical; others are demonstrations of mechanical mastery.','When you encounter an unfamiliar complication, ask three questions: What does it measure or do? What mechanism must exist to make it happen? Why might someone value it? Those questions turn vocabulary into understanding.'],
['Which is the best way to understand a complication?',['Memorize its name only','Understand the problem it solves and the mechanism that solves it','Assume more complications mean a better watch','Judge it only by price'],1,'A complication becomes meaningful when you understand its function and mechanism.'],
'Do not confuse rarity with quality. Complexity is impressive only when you understand what was actually accomplished.'],
'Cases, Crystals & Bezels':[
['The case is the watch’s protective architecture. Its dimensions affect comfort, visual presence and water resistance. Case shape can be round, square, tonneau, cushion or another form. The crystal protects the dial and may be acrylic, mineral glass or sapphire, each with different properties.','Bezels can be decorative or functional. A fixed bezel may frame the dial; a rotating dive bezel can track elapsed time underwater; a tachymeter scale can help calculate speed over a measured distance. Casebacks may reveal the movement, provide a solid protective barrier or carry specifications and markings.','Compare watches by proportion rather than diameter alone. Lug-to-lug length, thickness, bezel width and dial opening can make two watches with the same stated diameter wear very differently.'],
['Why can two watches with the same diameter wear very differently?',['Because diameter is only one part of proportion','Because crystals change the hour hand','Because straps determine movement accuracy','Because all cases have identical dimensions'],0,'Lug-to-lug length, thickness, bezel and dial proportions all affect wear.'],
'Judge the object as it sits on a wrist, not as a number on a specification sheet.'],
'Dials, Hands, Proportion & Straps':[
['A dial is an information interface. Markers, numerals, hands, colors and textures determine how quickly the wearer can read it. A dress watch may favor restraint and symmetry; a tool watch may favor contrast and immediate legibility. Hands must correspond to the visual language of the dial rather than merely being attractive individually.','Proportion is the quiet skill. A watch can be beautifully finished and still feel wrong if the hands are too short, the dial is crowded, the case is too thick or the bracelet overwhelms the case. Straps also change character: leather can formalize a watch, while fabric or rubber can make the same case more casual or technical.','A good design usually has hierarchy. The eye should know what to read first, second and third. If every element demands attention, the design becomes noise.'],
['What is the primary job of a dial?',['To maximize decoration','To present information clearly and coherently','To hide the movement','To increase water resistance'],1,'The dial is fundamentally an information interface.'],
'Good taste often appears as restraint: every visible element should have a reason to be there.'],
'Dive, Field & Pilot Watches':[
['Tool watches were shaped by environments. Dive watches needed reliable legibility, water resistance and elapsed-time measurement. Field watches emphasized simplicity, robustness and easy reading in changing conditions. Pilot watches developed large, legible displays and specialized scales because aviation created problems of navigation and timing.','These categories are useful as historical families, not rigid boxes. A modern watch may borrow the appearance of a military field watch without being military equipment, or use a dive-bezel design without ever seeing the ocean. Understanding the original use prevents you from confusing aesthetic language with actual capability.','When evaluating a tool watch, separate genuine specifications from visual cues. Water resistance, crown construction, bezel behavior, lume and testing tell you more than a fictional story printed on the dial.'],
['What should you distinguish when evaluating a modern tool watch?',['Its historical design language from its actual specifications','Its logo from its case color','Its price from its hour hand','Its strap from its history'],0,'A modern watch can borrow historical aesthetics without having the same practical capability.'],
'Know the tool before copying its appearance. Heritage is more meaningful when you understand the environment that created it.'],
'Racing, Chronographs & Professional Use':[
['Motorsport made elapsed time a practical obsession. Drivers and teams needed to measure laps, intervals and average speeds, while specialized scales could convert elapsed time into useful calculations. Aviation similarly created demand for precise timing, legibility and synchronized operations.','The chronograph became a cultural symbol because its technical purpose was visible. Pushers, subdials and scales communicated that the watch was built to measure something. This is a good example of engineering becoming design language: even when a wearer never times a lap, the visual grammar remains.','When you see a racing chronograph, identify the timing mechanism first. Then ask which scales are functional and which are primarily historical or decorative.'],
['Why did motorsport help shape chronograph design?',['Drivers needed elapsed-time information and speed-related calculations','Racing made all watches waterproof','Racing invented quartz','Drivers needed moonphase displays'],0,'Motorsport created real timing and speed-measurement problems.'],
'Learn to distinguish functional heritage from marketing. A story is valuable when the object’s design actually reflects the problem.'],
'How a Mechanical Movement Works':[
['A mechanical movement begins with stored energy in a mainspring. As the spring unwinds, the gear train transmits that energy while changing rotational speed. The escapement meters the release of energy in small increments, and the balance-and-hairspring oscillator provides the regular motion used to regulate the watch. The hands receive controlled motion through the final wheel and setting system.','The key mental model is energy → transmission → regulation → display. The mainspring stores energy; gears transmit it; the escapement controls release; the oscillator regulates the cycle; the display converts that movement into readable time. If you understand this chain, individual component names become much easier to learn.','A display back is most useful when you can look at it and ask what each visible system is doing. Decoration is secondary to function.'],
['Which sequence best describes a mechanical movement?',['Energy storage → gear train → escapement/oscillator → display','Battery → quartz crystal → rotor → bezel','Dial → strap → crown → crystal','Rotor → battery → GPS → hands'],0,'A mechanical movement stores energy, transmits it, regulates it and ultimately drives the display.'],
'Learn the system, not the parts list. Mechanical watchmaking becomes understandable when every component has a job in a larger chain.'],
'Accuracy, Finishing, Jewels & Service':[
['Watch quality has several dimensions. Accuracy concerns how closely the watch keeps time. Finishing concerns the treatment of visible and sometimes hidden surfaces: polishing, brushing, anglage, perlage, striping and other techniques. Jewels reduce friction at selected pivots; they are functional components, not simply decoration. Serviceability determines whether the machine can be maintained over decades.','A high jewel count is not automatically evidence of quality, and attractive finishing cannot compensate for poor regulation or an impractical design. Likewise, accuracy is not the only measure of a mechanical watch’s value. Evaluate the movement according to purpose: construction, reliability, regulation, finishing, service network and parts availability.','Service is part of ownership. Oils age, seals deteriorate, lubricated surfaces wear and regulation can change. A serious buyer should know who can service the movement and what that service realistically costs.'],
['Which is the strongest way to judge movement quality?',['Jewel count alone','Price alone','A combination of construction, performance, finishing and serviceability','Case weight alone'],2,'Movement quality is multidimensional; no single specification tells the whole story.'],
'Quality is judgment across several criteria. Do not let one impressive number replace understanding.'],
'Watch Houses & Watchmaking Traditions':[
['A watch house is more than a logo. To understand a maker, learn when it was founded, what it actually contributed, which movements or technologies it became known for, how its designs evolved, and what its present products genuinely inherit from that history. Some companies have long histories but outsource much of their modern production; others are younger but technically important.','A useful heritage test is to separate four things: documented history, technical achievement, design continuity and marketing mythology. A brand may have a famous historical association without every modern model carrying the same significance. Conversely, a lesser-known maker may have made an important technical contribution.','Choose several houses and compare them without using price as the first criterion. Ask what each is known for and whether its current collection reflects that identity.'],
['What is the best first question when evaluating watch heritage?',['How expensive is the brand?','What did the maker actually contribute and how does that relate to its current watches?','How many celebrities wear it?','Is the logo recognizable?'],1,'Heritage is strongest when documented history and present-day practice connect.'],
'Know the history well enough that marketing has less power over your judgment. Heritage should inform taste, not replace it.'],
'Choosing a Watch for Your Life':[
['Begin with your life, not a brand. Consider the situations in which the watch will be worn: work, formal events, travel, outdoor activity or daily casual use. Then consider fit, climate, water resistance, legibility, movement, serviceability and budget. A watch that looks excellent but is uncomfortable or inappropriate for your routine is not a good choice.','Fit is more than diameter. Consider lug-to-lug length, thickness, bracelet taper and how the watch sits under a cuff. Then evaluate the movement: quartz may be ideal for low maintenance; mechanical may appeal if you value the machine itself; automatic and manual-wind are different ownership experiences.','A disciplined purchase can be made without knowing the “right” brand. Write a specification for the watch you need without naming a manufacturer. Only after that should you compare actual watches.'],
['What should be the starting point for choosing a watch?',['The most famous brand','Your use case, fit and priorities','The highest jewel count','The current hype list'],1,'A good purchase begins with what the watch needs to do in your life.'],
'Choose slowly and wear often. A coherent watch is better than an impressive purchase that does not belong in your life.'],
'Read, Compare & Explain a Watch':[
['Mastery means you can look at an unfamiliar watch and explain it without relying on the logo. Start with observation: identify the case shape, approximate proportions, crystal, bezel, crown, dial layout, hands and strap. Then identify the movement type and ask how it receives energy.','Next read the functions. Is it three-hand, date, chronograph, GMT or something more specialized? Then reconstruct the history: what kind of tool or cultural object does the design resemble, and what problem originally produced that language? Finally evaluate the watch as an object: fit, legibility, construction, finishing, serviceability and suitability for its intended wearer.','A strong explanation should move from observation to evidence to judgment. “I like it” is a preference. “The compact case, high-contrast dial and simple hand set make it legible and appropriate for daily wear” is an explanation.','For a final assessment, take an unfamiliar watch and produce a one-minute briefing: identify its movement type, three visible functions or design choices, likely historical lineage, intended use, and one reason you would or would not recommend it.'],
['You are comparing two watches. Watch A has a quartz movement, excellent accuracy, a simple date display and a thin case. Watch B has an automatic mechanical movement, no date, a thicker case and visible finishing. Which conclusion is most defensible?',['Watch B is automatically better because it is mechanical','Watch A is automatically better because quartz is more accurate','The better choice depends on the wearer’s priorities, use case and appreciation of each trade-off','The more complicated watch is always more sophisticated'],2,'The correct judgment depends on criteria: accuracy and convenience may favor A, while mechanical interaction and finishing may favor B.'],
'Your goal is not to become a walking catalog. It is to develop enough knowledge to observe accurately, explain clearly, compare fairly and choose deliberately. That is horological judgment.']
};

// Final lessons in every subject are real capstones rather than descriptions of what a lesson should contain.
Object.assign(lessonDetails,{
'Building a Foundation Wardrobe':[['A wardrobe works as a system. A few versatile pieces in coherent colors, good proportions and appropriate levels of formality can serve more situations than a closet full of isolated purchases. Start with shirts, trousers, shoes, an adaptable jacket and outerwear appropriate to your climate.','The principle is substitution and combination. Each new garment should work with several existing pieces and solve a real need. This is why neutral foundations are useful: they make combinations easier and let texture, pattern and accessories provide variety.','Audit your wardrobe by category. Identify one missing capability rather than one item you simply want.'],['What makes a wardrobe foundation strong?',['Maximum number of garments','Versatile pieces that combine across situations','Only expensive brands','Following every current trend'],1,'A foundation wardrobe is useful because pieces work together across situations.'],'Buy to complete a system, not to collect isolated objects.'],
'Hosting':[['A host takes responsibility for the experience without making guests feel managed. That means preparing enough food and drink, understanding who is coming, making introductions, anticipating practical needs and recovering calmly when something goes wrong.','Good hosting is mostly invisible. The host notices an empty glass, a guest standing alone, an awkward lull or a dietary restriction before it becomes a problem. Preparation creates freedom during the event because you are not improvising every decision.','Before your next gathering, plan the arrival, first drink, introductions, food timing and departure. Then leave enough room for conversation to develop naturally.'],['What is the host’s primary responsibility?',['To impress guests with complexity','To control every conversation','To make guests comfortable and the occasion run well','To demonstrate superior knowledge'],2,'The host owns the conditions of the gathering, not the attention of every guest.'],'Good hosting is generosity organized with judgment.'],
'Being Useful as Guest or Crew':[['A useful guest or crew member reduces the burden on the person responsible. On a boat, that means listening to instructions, moving safely, learning the vocabulary, keeping gear secure and asking before interfering with a task. The same principle applies at a dinner, house or expedition: observe first, then contribute.','Seamanship rewards calm repetition. Learn where lines, cleats, lifejackets and emergency equipment are kept; understand basic commands; keep hands and feet clear of working lines; and never assume that familiarity with one boat transfers perfectly to another.','Practice the habit of asking one useful question before acting: “What do you want me to do?” followed by a concise confirmation.'],['What makes a guest genuinely useful?',['Acting independently without asking','Waiting passively for entertainment','Observing, listening and contributing where needed','Showing that you already know everything'],2,'Useful people reduce workload by paying attention and acting appropriately.'],'Competence begins with attention.'],
'Building an Eye for Quality':[['Taste develops through comparison. Looking at one object and declaring it beautiful teaches little; comparing several objects forces you to identify differences in proportion, material, craftsmanship, composition and intention. Art becomes easier to discuss when you can separate observation from interpretation and preference.','A practical method is: describe → analyze → contextualize → judge. Describe what is actually visible. Analyze how the parts create an effect. Contextualize the work historically and culturally. Then judge whether it succeeds on its own terms.','Choose two works that solve a similar artistic problem differently. Write three observations before giving an opinion.'],['Which sequence produces the strongest art judgment?',['Preference → conclusion → search for evidence','Description → analysis → context → judgment','Price → reputation → conclusion','Artist biography → automatic approval'],1,'Judgment is stronger when observation and context come before preference.'],'Good taste is not pretending to like everything. It is learning to explain why something succeeds or fails.'],
'How to Read a Great Book':[['A great book rewards rereading because it contains more than plot. Read for the author’s argument, the structure of the work, the choices of language, the behavior of characters and the assumptions beneath the story. Different genres require different questions, but all serious reading benefits from active attention.','Keep three layers separate: what happens, what the author is doing, and what you think about it. Confusing those layers makes criticism shallow. A novel can portray a bad person brilliantly; a philosophy book can make a powerful argument you ultimately reject.','For a serious reading session, write one sentence summarizing the central problem, three passages or ideas that matter, and one question the book leaves unresolved.'],['What separates active reading from passive reading?',['Remembering the plot only','Interpreting structure, ideas, language and evidence','Reading as quickly as possible','Agreeing with the author'],1,'Active reading examines how and why the work produces its meaning.'],'Read to understand before you read to agree or disagree.'],
'Why Film Music Changes a Scene':[['Film music shapes attention and emotion without requiring the audience to consciously notice it. A score can establish place, suggest danger, create anticipation, reveal a character’s inner state or change the meaning of an image. Silence can perform the same function by removing expected emotional guidance.','Leitmotifs associate musical ideas with characters, places or concepts. Rhythm can increase perceived motion; harmony can create tension or release; orchestration changes color and scale. A scene can therefore feel completely different when the music changes even though the images remain identical.','Watch a short scene twice with sound and once with the sound removed. Write down what you assume will happen in each version.'],['Why can music change a scene without changing the images?',['Music controls only dialogue volume','Music changes emotional expectation, attention and interpretation','Music changes the camera lens','Music makes every scene happier'],1,'Music influences how viewers interpret timing, emotion and meaning.'],'Listen for what the music is making you expect before asking whether you like the score.'],
'Grace Under Social Pressure':[['Composure is not passivity. Under pressure, the goal is to slow the reaction enough to choose the useful response. If someone is rude, corrects you publicly or creates an awkward moment, you can acknowledge the situation without surrendering your dignity or escalating it.','A practical sequence is: pause → assess → choose the smallest effective response → move forward. In disagreement, distinguish a factual correction from an attack on status. In embarrassment, correct what needs correcting and avoid turning the moment into a performance about yourself.','Practice with low-stakes situations: being interrupted, receiving an unfair criticism, making a social mistake or encountering someone who is deliberately provocative.'],['What is the purpose of composure under pressure?',['Never showing emotion','Winning every confrontation','Creating enough space to choose an effective response','Avoiding all disagreement'],2,'Composure gives you control over your response without requiring you to suppress every emotion.'],'The gentleman is not the person who never encounters awkwardness. He is the person who does not make awkwardness worse.'],
'Travel Risk & Situational Awareness':[['Situational awareness is the ability to notice what is changing around you and act before a problem becomes urgent. It begins with ordinary habits: know where you are, know how you will leave, protect essential documents and money, and recognize when the environment differs from what you expected.','Good travel risk management is proportional. Do not become paranoid about every possibility; identify the few risks that could seriously disrupt the trip and prepare for them. Keep backups, know local emergency procedures, maintain communication and have enough margin to handle delays.','Before entering an unfamiliar place, spend thirty seconds identifying exits, transport options, safe public areas and the location of your essential belongings.'],['What is the goal of situational awareness?',['Constant suspicion','Predicting every possible event','Noticing meaningful changes early enough to respond effectively','Avoiding unfamiliar places'],2,'Awareness creates time and options; it is not the same as fear.'],'Preparedness should make you calmer, not more anxious.'],
'Philosophy in Daily Life':[['Philosophy becomes useful when it changes how you examine a decision. Before acting, clarify the question, identify assumptions, distinguish facts from values and consider what follows from each possible choice. This is the practical extension of philosophical reasoning.','Suppose you are deciding whether to accept an opportunity. Ask what kind of person the decision helps you become, what duties you owe others, what consequences are likely, and which parts are actually under your control. Different traditions emphasize different questions; together they can expose blind spots.','Choose one real decision and write the argument for and against it as fairly as you can. Then identify the premise you are least certain about.'],['What is philosophy doing in a practical decision?',['Replacing evidence with opinion','Providing questions and frameworks for examining assumptions and choices','Guaranteeing one correct answer','Avoiding action'],1,'Philosophy helps clarify assumptions, values, reasoning and consequences.'],'The point of philosophy is not to sound profound. It is to think more carefully when the answer matters.'],
'Religion, Philosophy & Meaning':[['Worldviews answer questions that facts alone do not settle: What is a good life? What is ultimately real? What obligations do we have? What gives suffering meaning? Religions answer these through traditions of belief, practice, community and sacred stories; philosophy may approach some of the same questions through argument and reason.','Comparison requires accuracy and humility. Similar words can conceal different meanings, and traditions contain internal diversity. It is better to say “this tradition contains several interpretations” than to force every believer into one simplified description.','Choose two traditions or worldviews and compare one question—such as human nature, suffering or the good life—using primary or reputable sources rather than stereotypes.'],['What is the most responsible way to compare worldviews?',['Reduce each to one slogan','Compare their actual claims while recognizing internal diversity','Assume all traditions mean the same thing','Judge before learning'],1,'Good comparison requires accurate representation and awareness of diversity.'],'Understanding another worldview does not require adopting it. Intellectual hospitality is part of serious education.'],
'Thinking Like an Economist':[['Economic thinking begins with scarcity. Because time, money, labor and resources are limited, choosing one thing means giving up something else. Opportunity cost is the value of the best alternative forgone. Prices and incentives then coordinate behavior, though markets can also fail when information, externalities or institutional conditions distort outcomes.','A useful economic question is “compared with what?” If a policy produces a benefit, what resources could have produced elsewhere? If a price changes behavior, what incentive changed? If a market outcome seems unfair, separate the question of efficiency from the question of distribution.','Take one everyday decision—a commute, purchase, course schedule or subscription—and identify its alternatives, opportunity cost and incentives.'],['Which question best reflects economic reasoning?',['Is this expensive?','Compared with what alternative, and what incentives or trade-offs does the choice create?','Do I personally like it?','Can everyone have it simultaneously?'],1,'Economic reasoning makes alternatives, incentives and trade-offs explicit.'],'A good economic argument names its trade-offs instead of pretending scarcity does not exist.'],
'Why Great Cars Are Great':[['A great car is rarely great because of one specification. Its character comes from the interaction of powertrain, chassis, steering, brakes, proportions, ergonomics, sound, visibility, materials and the way those systems communicate with the driver. Engineering choices create trade-offs, and the best cars make those trade-offs feel coherent.','History matters because a great car often answers a particular problem unusually well. A sports car may prioritize lightness and feedback; a grand tourer may prioritize high-speed comfort; a rugged utility vehicle may prioritize durability and clearance. Racing can accelerate technical development, but road cars translate those ideas according to different constraints.','When evaluating a car, describe what it is trying to be before judging whether it succeeds. Then identify two engineering choices that support that mission and one trade-off the designer accepted.'],['What is the strongest way to judge a great car?',['Horsepower alone','Price alone','How coherently its engineering choices serve its intended character and use','How famous the badge is'],2,'Greatness comes from coherent execution of a purpose, not a single number.'],'Understand the mission, the engineering and the trade-offs. Then you can explain why a car is great rather than merely saying that it is.']
});

const lessons=[];for(const [subject,rows] of Object.entries(curricula))rows.forEach((r,i)=>lessons.push({id:subject+'::'+i,subject,module:r[0],title:r[1],level:r[2],text:r[3],order:i}));
lessons.forEach(l=>{if(lessonMap[l.title])lessonMap[l.subject+'::'+l.title]=lessonMap[l.title]});
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('gentlemanState',JSON.stringify(state))}function subject(name){return subjects.find(s=>s.name===name)}function subjLessons(name){return lessons.filter(l=>l.subject===name)}function progress(name){let a=subjLessons(name);return Math.round(a.filter(l=>state.done.includes(l.id)).length/a.length*100)}function score(){let c=state.done.length/lessons.length,q=state.quizTotal?state.quizCorrect/state.quizTotal:0;return Math.round((c*.75+q*.25)*100)}
function activate(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function toggleDrawer(){document.getElementById('drawer').classList.toggle('open');document.getElementById('drawerBackdrop').classList.toggle('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerBackdrop').classList.remove('open')}function drawerGo(view,name){closeDrawer();go(view,name)}
function go(view,name){closeModal();closeDrawer();if(view==='subject'){renderSubject(name);activate('subject')}else{activate(view);if(view==='home')renderHome();if(view==='learn')renderLearn();if(view==='situations')renderSituations();if(view==='progress')renderProgress()}}
function renderHome(){let daily=lessons.find(l=>!state.done.includes(l.id))||lessons[0],s=subject(daily.subject),sc=score(),completed=state.done.length;document.getElementById('home').innerHTML=`<div class="home-intro"><div class="eyebrow">A cultivated education</div><h2>Become the kind of man who knows why things matter.</h2><p class="muted">The Gentleman is a practical education in knowledge, judgment, conduct and competence. Learn the history behind things, recognize them in the real world, and develop the vocabulary to discuss them naturally.</p></div><div class="home-grid"><div class="card home-card daily" style="--accent:${s.accent}"><div class="label" style="color:${s.accent}">Continue your education · ${esc(daily.subject)}</div><h3 style="font-size:29px">${esc(daily.title)}</h3><p class="muted">${esc(daily.text)}</p><div class="actions"><button class="btn primary" onclick="openLesson('${esc(daily.id)}')">Begin lesson →</button><button class="btn" onclick="go('subject','${esc(daily.subject)}')">View course</button></div></div><div class="card home-card"><div class="label">Gentleman’s Index</div><div class="stat">${sc}</div><div class="progress"><i style="width:${sc}%;background:${s.accent}"></i></div><p class="muted">${completed} of ${lessons.length} lessons completed.</p><div class="home-kpis"><div class="home-kpi"><strong>${subjects.filter(x=>progress(x.name)>0).length}</strong><span class="muted">subjects started</span></div><div class="home-kpi"><strong>${state.quizTotal?Math.round(state.quizCorrect/state.quizTotal*100):0}%</strong><span class="muted">quiz accuracy</span></div><div class="home-kpi"><strong>${completed}</strong><span class="muted">lessons learned</span></div></div></div></div><div class="home-callout"><strong>How to use the app.</strong> Learn the lesson, inspect the real-world examples, take the knowledge test, then use the vocabulary in conversation. The goal is not to perform sophistication; it is to genuinely know what you are talking about.</div><div class="grid"><div class="card wide"><div class="eyebrow">Your learning path</div><h3>${esc(daily.subject)}</h3><p class="muted">${progress(daily.subject)}% complete. Courses begin with context and history, then move into fundamentals, recognition, application and mastery.</p><button class="btn" onclick="go('subject','${esc(daily.subject)}')">Continue course →</button></div><div class="card"><div class="eyebrow">Today’s principle</div><p class="principle">Know the difference between having an opinion and having the knowledge to support one.</p></div></div><div class="eyebrow" style="margin-top:28px">Explore</div><div class="subject-strip">${subjects.slice(0,4).map(x=>`<div class="mini-subject" onclick="go('subject','${esc(x.name)}')" style="--accent:${x.accent}"><strong>${x.icon} ${esc(x.name)}</strong><span class="muted">${progress(x.name)}% complete</span></div>`).join('')}</div>`}
function renderLearn(){document.getElementById('learn').innerHTML=`<div class="eyebrow">Curriculum</div><h2>Subjects</h2><p class="muted">Each subject follows its own logic: why it matters, where it came from, how it works, and how to use good judgment.</p><div class="cards">${subjects.map(s=>`<div class="card topic" onclick="go('subject','${esc(s.name)}')" style="--accent:${s.accent}"><div class="icon">${s.icon}</div><h3>${esc(s.name)}</h3><p class="muted">${progress(s.name)}% complete · ${subjLessons(s.name).length} lessons</p><div class="progress"><i style="width:${progress(s.name)}%;background:${s.accent}"></i></div></div>`).join('')}</div>`}
function renderSubject(name){let s=subject(name),arr=subjLessons(name),groups=[];arr.forEach(l=>{let g=groups.find(x=>x.name===l.module);if(!g){g={name:l.module,items:[]};groups.push(g)}g.items.push(l)});document.getElementById('subject').innerHTML=`<div class="eyebrow" style="color:${s.accent}">${s.icon} ${esc(name)}</div><div class="path-head"><div><h2>${esc(name)}</h2><p class="muted">A course, not a checklist. Start at the beginning to understand why the subject matters; jump ahead whenever you need a reference.</p></div><button class="btn primary" onclick="startQuiz('${esc(name)}')">Test yourself</button></div><div class="progress" style="margin-top:20px"><i style="width:${progress(name)}%;background:${s.accent}"></i></div><div class="path">${groups.map((g,i)=>{let done=g.items.filter(l=>state.done.includes(l.id)).length;return `<div class="module" style="--accent:${s.accent};border-left:4px solid ${s.accent}"><div class="module-head"><div><strong>${i+1}. ${esc(g.name)}</strong><div><span>${done}/${g.items.length} complete</span></div></div><span>Module ${i+1}</span></div>${g.items.map(l=>`<div class="lesson-row" onclick="openLesson('${esc(l.id)}')"><div class="check ${state.done.includes(l.id)?'done':''}">${state.done.includes(l.id)?'✓':i+1}</div><div><div class="lesson-title">${esc(l.title)}</div><div class="lesson-meta">${esc(l.level)} · ${esc(l.text)}</div></div><span class="pill">${state.done.includes(l.id)?'Completed':'Learn'}</span></div>`).join('')}</div>`}).join('')}</div>`}
let lessonState={id:null,pages:[],page:0,answer:{}};
function pagesFor(l){
 const d=lessonMap[l.subject+'::'+l.title];
 const visual=`<div class="lesson-visual" style="--accent:${s.accent}"><div><div class="visual-label" style="color:${s.accent}">Visual reference</div><strong>See real examples of ${esc(l.title)}</strong><p class="muted">Use Google Images to study real objects, people, places or examples from this lesson.</p></div><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(l.title+' '+l.subject)}" style="border-color:${s.accent}">View images →</a></div>`;
 if(d){
   const q=d.quiz||['Which statement is a factual point taught in this lesson?',[d.know,d.history,d.talk,'The subject is entirely a matter of personal taste.'],0,d.know];
   const pages=[
    {type:'Why it matters',title:l.title,body:[d.why]},
    {type:'History & context',title:'How we got here',body:[d.history]},
    {type:'Core knowledge',title:'What you should know',body:[d.know]},
    {type:'Real world',title:'See it in the wild',body:[d.real,d.talk]},
    {type:'Assessment',title:'Prove you understand it',prompt:q[0],options:q[1],correct:q[2],answer:q[3],body:[]},
    {type:'Conversation',title:'Be able to talk about it',body:[d.talk,'A useful test: explain the idea to another person in two or three sentences without using empty praise or jargon.']}
   ];
   pages[3].visual=visual; pages[0].visual=visual;
   return pages;
 }
 // Strong subject-specific fallback: never claim that generic reflection is a lesson.
 const subjectFocus={
  'Style & Dress':'Learn the vocabulary, history and practical distinctions that let you identify garments and dress appropriately.',
  'Dining & Drinks':'Learn the ingredients, traditions, service conventions and vocabulary that let you participate intelligently.',
  'Practical Skills':'Learn the mechanism, procedure and safety principle behind the skill.',
  'Seamanship':'Learn the nautical terminology, physical principle and safety implication behind the practice.',
  'Art & Architecture':'Learn the historical movement, visual vocabulary and evidence used to interpret the work.',
  'History & Literature':'Learn the chronology, primary concepts, evidence and cultural consequences.',
  'Music & Culture':'Learn the musical vocabulary, historical development and recognizable examples.',
  'Conversation & Etiquette':'Learn the social convention, why it developed and how to use it without becoming rigid.',
  'Travel':'Learn the system, historical reason for the convention and practical behavior.',
  'Philosophy':'Learn the argument, its assumptions, its strongest objection and its practical consequence.',
  'Religion & Worldviews':'Learn the tradition, historical setting, key concepts and internal diversity.',
  'Civics & Economics':'Learn the institution or economic mechanism, incentives and real-world consequences.',
  'Cars & Motoring':'Learn the engineering system, historical development and trade-offs.'
 };
 return [
  {type:'Orientation',title:l.title,body:[subjectFocus[l.subject]||l.text]},
  {type:'History',title:'Where this came from',body:[`The modern form of ${l.title.toLowerCase()} is the result of earlier problems, conventions and technologies. Learn what changed and what remained.`]},
  {type:'Core knowledge',title:'The vocabulary',body:[`Know the important terms associated with ${l.title.toLowerCase()}. Build a mental model before trying to memorize names.`]},
  {type:'Examples',title:'Real-world examples',body:[`Find three real examples of ${l.title.toLowerCase()}. Identify the evidence that makes each example belong to this category.`],visual:`<div class="lesson-visual"><div><div class="visual-label">Visual reference</div><strong>Google Images: ${esc(l.title)}</strong></div><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(l.title+' '+l.subject)}">View images →</a></div>`},
  {type:'Assessment',title:'Knowledge check',prompt:`Which approach demonstrates actual knowledge of ${l.title.toLowerCase()}?`,options:[`Being able to define the key terms and recognize real examples`,`Saying whether you personally like it`,`Knowing that the topic is important`,`Remembering the lesson title`],correct:0,answer:'Knowledge means you can define, recognize and explain the subject—not merely express an opinion.'},
  {type:'Conversation',title:'Use it in conversation',body:[`A useful conversation contribution about ${l.title.toLowerCase()} should contain one concrete fact, one example and one reason it matters. Avoid performing expertise.`]}
 ];
}

function openLesson(id){let l=lessons.find(x=>x.id===id);if(!l)return;lessonState={id,pages:pagesFor(l),page:0,answer:{}};activate('lesson');renderLesson()}
function renderLesson(){let l=lessons.find(x=>x.id===lessonState.id),p=lessonState.pages[lessonState.page],s=subject(l.subject),last=lessonState.page===lessonState.pages.length-1,chosen=lessonState.answer[lessonState.page];let checkpoint=p.options?`<div class="checkpoint"><strong>${esc(p.prompt)}</strong>${p.options.map((o,i)=>`<button class="choice ${chosen===i?'selected':''} ${chosen!==undefined&&i===p.correct?'correct':''}" onclick="answerLesson(${i})">${esc(o)}</button>`).join('')}<div class="checkpoint-answer" style="display:${chosen!==undefined?'block':'none'}"><strong>${chosen===p.correct?'Correct.':'Review.'}</strong> ${esc(p.answer)}</div></div>`:'';let finish=last?`<div class="actions"><button class="btn primary" onclick="completeLesson('${esc(l.id)}')">${state.done.includes(l.id)?'✓ Completed':'Complete lesson'}</button><button class="btn" onclick="go('subject','${esc(l.subject)}')">Back to path</button></div>`:'';let body=(p.body||[]).map(x=>`<p>${esc(x)}</p>`).join('')+(p.visual||'');document.getElementById('lesson').innerHTML=`<div class="lesson-section" style="--accent:${s.accent}"><div class="lesson-full"><div class="lesson-top"><div class="actions" style="margin:0"><button class="btn" onclick="go('home')">⌂ Home</button><button class="btn" onclick="go('subject','${esc(l.subject)}')">← ${esc(l.subject)}</button></div><span class="badge">${esc(l.level)} · Page ${lessonState.page+1} of ${lessonState.pages.length}</span></div><div class="lesson-content"><div class="lesson-page-full"><div class="lesson-page-type">${esc(p.type)}</div><h2>${esc(p.title)}</h2><div class="lesson-body">${body}</div>${checkpoint}${finish}</div></div><div class="lesson-bottom"><button class="btn" onclick="lessonBack()" ${lessonState.page===0?'disabled':''}>← Back</button><div class="lesson-dots">${lessonState.pages.map((_,i)=>`<span class="lesson-dot ${i===lessonState.page?'active':''} ${i<lessonState.page?'done':''}"></span>`).join('')}</div>${last?'':`<button class="btn primary" onclick="lessonNext()">Next →</button>`}</div></div></div>`}

function answerLesson(i){lessonState.answer[lessonState.page]=i;renderLesson()}function lessonNext(){if(lessonState.page<lessonState.pages.length-1){lessonState.page++;renderLesson()}}function lessonBack(){if(lessonState.page>0){lessonState.page--;renderLesson()}}function completeLesson(id){if(!state.done.includes(id)){state.done.push(id);save();toast('Lesson completed · progress saved')}go('subject',lessons.find(l=>l.id===id).subject)}
function shuffle(a){return a.map(v=>({v,r:Math.random()})).sort((x,y)=>x.r-y.r).map(x=>x.v)}
function quizQuestions(name){
 const arr=subjLessons(name);
 const qs=arr.map(l=>{
   const d=lessonMap[l.subject+'::'+l.title];
   if(d&&d.quiz){let q=d.quiz;let choices=q[1].map((v,i)=>({v,correct:i===q[2]}));choices=shuffle(choices);return {q:q[0],a:choices.map(x=>x.v),c:choices.findIndex(x=>x.correct),why:q[3]};}
   let choices=shuffle([{v:l.text,correct:true},{v:`It is mainly a matter of personal taste`,correct:false},{v:`It cannot be explained without an opinion`,correct:false},{v:`It is important only because the app includes it`,correct:false}]);return {q:`Which statement is a factual claim about ${l.title}?`,a:choices.map(x=>x.v),c:choices.findIndex(x=>x.correct),why:l.text};
 });
 return shuffle(qs).slice(0,Math.min(10,qs.length));
}
function startQuiz(name){let qs=quizQuestions(name),i=0,c=0;function showQ(){let q=qs[i];show(`<div class="eyebrow">Knowledge test · ${esc(name)}</div><h2>${esc(q.q)}</h2><p class="muted">Question ${i+1} of ${qs.length}</p>${q.a.map((a,j)=>`<button class="quizopt" onclick="quizAnswer(${j},${q.c})">${esc(a)}</button>`).join('')}`)}window.quizAnswer=function(chosen,correct){let ok=chosen===correct;if(ok)c++;i++;if(i<qs.length)showQ();else{state.quizCorrect+=c;state.quizTotal+=qs.length;save();show(`<div class="eyebrow">Knowledge test complete</div><h2>${c}/${qs.length}</h2><p class="muted">The test measures subject knowledge: terminology, history, functions, examples and distinctions.</p><button class="btn primary" onclick="closeModal();renderAll()">Finish</button>`)}};showQ()}
function show(x){document.getElementById('modalBody').innerHTML=x;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function renderSituations(){document.getElementById('situations').innerHTML='<div class="eyebrow">Real life</div><h2>Situational Guides</h2><p class="muted">Practice judgment where knowledge becomes conduct.</p><div class="cards">'+['Dinner at a Good Restaurant','Meeting Someone Important','Being a Guest','Hosting Friends','Traveling Abroad','Handling a Mistake'].map((x,i)=>`<div class="card topic" onclick="show('<div class=\'eyebrow\'>Situational guide</div><h2>${x}</h2><p class=\'muted\'>Observe the room, prepare appropriately, treat everyone with courtesy, and handle uncertainty calmly. The objective is not to perform sophistication; it is to make the situation better.</p>')"><h3>${x}</h3><p class="muted">Practical judgment guide.</p></div>`).join('')+'</div>'}
function renderProgress(){let sc=score();document.getElementById('progress').innerHTML=`<div class="eyebrow">Your development</div><h2>Gentleman’s Profile</h2><div class="profile"><div class="card" style="text-align:center"><div class="eyebrow">Gentleman’s Index</div><div class="ring" style="background:conic-gradient(var(--gold) ${sc}%,#293641 0)"><div class="ring-inner"><strong>${sc}</strong></div></div><p class="muted">Breadth, depth and practical judgment.</p><button class="btn" onclick="resetProgress()">Reset progress</button></div><div class="card"><div class="eyebrow">Subject mastery</div>${subjects.map(s=>`<div class="kpi"><strong>${s.icon} ${esc(s.name)}</strong><span>${progress(s.name)}%</span><div class="progress"><i style="width:${progress(s.name)}%;background:${s.accent}"></i></div></div>`).join('')}</div></div>`}
function resetProgress(){if(confirm('Reset all progress on this device?')){localStorage.removeItem('gentlemanState');location.reload()}}function renderAll(){renderHome();renderLearn();renderSituations();renderProgress()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>go('subject',b.dataset.subject));document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};renderAll();
</script></body></html>
